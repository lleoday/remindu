<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RemindU - Kategori</title>
  <style>
    :root {
      --primary: #6C63FF;
      --primary-light: #EEF0FF;
      --danger: #FF5C5C;
      --text: #1a1a2e;
      --subtext: #6b7280;
      --bg: #f9f9fb;
      --card: #ffffff;
      --border: #e5e7eb;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 16px 24px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 10;
    }
    header h1 { font-size: 20px; font-weight: 700; color: var(--primary); }
    nav { display: flex; gap: 12px; }
    nav a {
      font-size: 13px; color: var(--subtext); text-decoration: none;
      padding: 6px 12px; border-radius: 8px; transition: background 0.2s;
    }
    nav a:hover, nav a.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
    .container { max-width: 680px; margin: 0 auto; padding: 24px 16px; }
    .form-card {
      background: var(--card); border-radius: var(--radius);
      padding: 20px; margin-bottom: 24px;
      box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .form-card h3 {
      font-size: 13px; font-weight: 600; color: var(--subtext);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px;
    }
    .form-row { display: flex; gap: 10px; align-items: flex-end; }
    .form-group { flex: 1; }
    .form-group label { font-size: 12px; color: var(--subtext); display: block; margin-bottom: 4px; }
    input[type="text"] {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; color: var(--text);
      background: var(--bg); outline: none; transition: border 0.2s;
    }
    input[type="text"]:focus { border-color: var(--primary); }
    input[type="color"] {
      width: 48px; height: 42px; border: 1px solid var(--border);
      border-radius: 8px; cursor: pointer; padding: 2px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 18px; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
      white-space: nowrap;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-danger { background: var(--danger); color: white; padding: 6px 10px; font-size: 13px; }
    .section-title {
      font-size: 13px; font-weight: 600; color: var(--subtext);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px;
    }
    .kategori-card {
      background: var(--card); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 10px;
      box-shadow: var(--shadow); border: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .warna-dot { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; }
    .kategori-nama { flex: 1; font-size: 15px; font-weight: 500; }
    .empty { text-align: center; padding: 40px; color: var(--subtext); font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>📝 RemindU</h1>
    <nav>
      <a href="index.html">Tasks</a>
      <a href="subtasks.html">Sub Tasks</a>
      <a href="kategori.html" class="active">Kategori</a>
      <a href="notifikasi.html">Notifikasi</a>
      <a href="profil.html">Profil</a>
    </nav>
  </header>
  <div class="container">
    <div class="form-card">
      <h3>Tambah Kategori</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Nama Kategori</label>
          <input type="text" id="nama_kategori" placeholder="Contoh: Hobi">
        </div>
        <div class="form-group" style="flex:0">
          <label>Warna</label>
          <input type="color" id="warna_hex" value="#6C63FF">
        </div>
        <button class="btn btn-primary" onclick="tambahKategori()">+ Tambah</button>
      </div>
    </div>
    <div class="section-title">Daftar Kategori</div>
    <div id="kategori-list"></div>
  </div>
  <script>
    const API = 'http://localhost:3000/api';
    const ID_PENGGUNA = 6;
    async function loadKategori() {
      const res = await fetch(`${API}/kategori/${ID_PENGGUNA}`);
      const data = await res.json();
      const container = document.getElementById('kategori-list');
      if (data.length === 0) {
        container.innerHTML = '<div class="empty">Belum ada kategori.</div>';
        return;
      }
      container.innerHTML = data.map(k => `
        <div class="kategori-card">
          <div class="warna-dot" style="background:${k.warna_hex}"></div>
          <div class="kategori-nama">${k.nama_kategori}</div>
          ${k.id_pengguna ? `<button class="btn btn-danger" onclick="hapusKategori(${k.id_kategori})">🗑️</button>` : '<span style="font-size:11px;color:#aaa">Default</span>'}
        </div>
      `).join('');
    }
    async function tambahKategori() {
      const nama_kategori = document.getElementById('nama_kategori').value.trim();
      const warna_hex = document.getElementById('warna_hex').value;
      if (!nama_kategori) return alert('Nama kategori tidak boleh kosong!');
      await fetch(`${API}/kategori`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id_pengguna: ID_PENGGUNA, nama_kategori, warna_hex })
      });
      document.getElementById('nama_kategori').value = '';
      loadKategori();
    }
    async function hapusKategori(id_kategori) {
      if (!confirm('Hapus kategori ini?')) return;
      await fetch(`${API}/kategori/${id_kategori}`, { method: 'DELETE' });
      loadKategori();
    }
    loadKategori();
  </script>
</body>
</html>
